# Change these four fields to your own information.
name: "Ruichen Deng"
affiliation: "Nankai University · School of Science of Mathematics"
email: "2311274@mail.nankai.edu.cn"
description: "Personal homepage, notes, and useful links."

title: "Personal Homepage"
lang: en
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_id_prefix: content-
collections:
  notes:
    output: true
    permalink: /notes/:name.html
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
exclude:
  - content
  - README.md
  - Gemfile
  - Gemfile.lock
  - templates
  - vendor
  - .bundle
  - .sites-runtime
