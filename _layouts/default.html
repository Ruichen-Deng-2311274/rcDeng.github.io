<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
{% if page.collection == 'notes' %}{% assign root = '../' %}{% else %}{% assign root = './' %}{% endif %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.name | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23245d87'/%3E%3Cpath d='M7 8h6l3 2 3-2h6v17h-6l-3 2-3-2H7zM16 10v17' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <a class="site-name" href="{{ root }}index.html">{{ site.name | escape }}</a>
      <nav aria-label="Main navigation">
        <a href="{{ root }}index.html"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ root }}notes.html"{% if page.nav == 'notes' or page.collection == 'notes' %} aria-current="page"{% endif %}>Notes</a>
        <a href="{{ root }}links.html"{% if page.nav == 'links' %} aria-current="page"{% endif %}>Useful Links</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">{{ site.name | escape }}</footer>
  </div>
</body>
</html>
